# Site settings
title:          ⸮pam
description: >-
  'Pam' means why in Welsh. Spam means "to bombard...with unsolicited and unwanted material over the internet".
  And, in reverse, it reads 'map'. These words describe what I share here quite well: finding your why and matters such as running, the environment, meditation, technology, and sobriety.
baseurl:        ""
url:            "https://elisparry.github.io"

# Google Analytics
google_analytics: UA—XXXXXXXX-X

# Author
author:
  name:         elis parry
  url:          https://elisparry.github.io
  email:        elis.parry@proton.me

# Build settings
markdown:       kramdown
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec, assets/css/theme.scss ]
