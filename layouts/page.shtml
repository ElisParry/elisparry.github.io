<extend template="base.shtml">
<head id="head">
</head>
<body id="body">
	<main>
		<h1>
			<ctx :text="$page.title"></ctx>
		</h1>
		<article>
			<ctx :shtml="$page.content()"></ctx>
			<div :if="$page.footnotes?()" class="footnotes" role="doc-endnotes">
				<hr>
				<ol :loop="$if">
					<li id="$loop.it.def_id">
						<ctx :shtml="$loop.it.shtml()"></ctx>
						<ctx :loop="$loop.it.ref_ids">
							<a class="footnote-backref" href="$loop.it.prefix('#')">Back ↩︎</a>
						</ctx>
					</li>
				</ol>
			</div>
		</article>
	</main>
</body>
